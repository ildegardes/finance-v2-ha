name: Open Finance synthetic checks

on:
  pull_request:
  push:
    branches: [master, codex/open-finance-visual]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: finance-v17/src:tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned deployment dependencies
        run: python -m pip install --require-hashes -r finance-v17/requirements-deploy.txt
      - name: Analytics
        run: python -m unittest discover -s tests -p test_open_finance_analytics.py
      - name: Classification, audit, financial flows and migration
        run: python -m unittest discover -s tests -p test_open_finance_classification.py
      - name: Effective categories, portfolio and schema 14
        run: python -m unittest discover -s tests -p test_open_finance_034.py
      - name: Economic recognition, schedules, snapshots and global pagination
        run: python -m unittest discover -s tests -p test_open_finance_035.py
      - name: SnapTrade Personal, FX, snapshots and provider isolation
        run: python -m unittest discover -s tests -p test_snaptrade_036.py
      - name: SnapTrade SDK Personal contract and sanitized diagnostics
        run: python -m unittest discover -s tests -p test_snaptrade_037.py
      - name: Consolidated portfolio, cards, income and presentation currency
        run: python -m unittest discover -s tests -p test_open_finance_038.py
      - name: Pluggy card parity, reference-driven FX and institutional policy
        run: python -m unittest discover -s tests -p test_open_finance_039.py
      - name: Card binding diagnostics and validated collection recovery
        run: python -m unittest discover -s tests -p test_open_finance_040.py
      - name: Preserved credit positions and bill provenance
        run: python -m unittest discover -s tests -p test_open_finance_041.py
      - name: Native open balances and per-connection schedule
        run: python -m unittest discover -s tests -p test_open_finance_042.py
      - name: Automatic schedule and restart policy
        run: python -m unittest discover -s tests/auto_sync -p test_release_policy.py
      - name: Linux keyring and backup restoration
        run: python -m unittest discover -s tests -p test_pluggy_keyring.py
      - name: Authentication
        run: python -m unittest discover -s tests -p test_d08_auth.py
      - name: Output privacy
        run: python -m unittest discover -s tests -p test_output_privacy.py
      - name: Synthetic institution administration
        run: python -m unittest discover -s tests -p test_open_finance_registry_admin.py
      - name: Prepare schema 10 baseline
        run: |
          mkdir -p "$RUNNER_TEMP/schema10"
          git archive 62fb50e finance-v17/src | tar -x -C "$RUNNER_TEMP/schema10"
          test -f "$RUNNER_TEMP/schema10/finance-v17/src/finance_v2/migrations.py"
          echo "FINANCE_SCHEMA10_BASELINE_SRC=$RUNNER_TEMP/schema10/finance-v17/src" >> "$GITHUB_ENV"
      - name: Gate B
        run: python -m unittest discover -s tests -p test_gate_b.py
      - name: Compatibility and credential protection
        run: |
          python -m unittest discover -s tests -p test_addon_config_integration.py
          python -m unittest discover -s tests -p test_full_coverage.py
          python -m unittest discover -s tests -p test_gate_c1.py
          python -m unittest discover -s tests -p test_pluggy_credential_protection.py
          python -m unittest discover -s tests -p test_santander_binding_recovery.py
      - name: C6R synthetic concurrency
        run: python -m unittest discover -s tests -p test_gate_c6r.py
      - name: C6R sanitized diagnostics negative test
        run: python -m unittest discover -s tests -p test_c6r_stress_instrumentation.py
      - name: C6R 100-iteration synthetic stress
        run: python tests/c6r_stress_campaign.py --iterations 100 > c6r-stress.jsonl
      - name: Preserve C6R stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c6r-stress-synthetic
          path: c6r-stress.jsonl
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install synthetic browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
          # The hosted runner often already has the runtime libraries. Exercise
          # the exact binary used below before installing system packages.
          smoke='const {chromium}=require("playwright"); (async()=>{const browser=await chromium.launch({executablePath:chromium.executablePath()}); await browser.close()})().catch(error=>{console.error(error);process.exitCode=1})'
          if ! node -e "$smoke"; then
            npx playwright install-deps chromium
            node -e "$smoke"
          fi
          echo "PLAYWRIGHT_MODULE=$PWD/node_modules/playwright" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Connections, institutions and concurrency in browser
        run: |
          node tests/open_finance_connections_ui.cjs
          node --test tests/test_financial_institutions_ui.cjs
          node tests/open_finance_product_concurrency_ui.cjs
          node tests/open_finance_product_races_ui.cjs
          node tests/open_finance_product_states_ui.cjs
          node tests/open_finance_privacy_attributes_ui.cjs
          node tests/open_finance_overview_ui.cjs
          node tests/open_finance_flow_ui.cjs
      - name: Browser with WSGI and synthetic SQLite
        run: |
          python -m unittest discover -s tests -p test_open_finance_integrated_ui.py
          python -m unittest discover -s tests -p test_open_finance_classification_ui.py
          python -m unittest discover -s tests -p test_snaptrade_036_ui.py
          python -m unittest discover -s tests -p test_snaptrade_037_ui.py
          python -m unittest discover -s tests -p test_open_finance_038_ui.py
          python -m unittest discover -s tests -p test_open_finance_041_ui.py
          python -m unittest discover -s tests -p test_open_finance_042_ui.py

  addon-image:
    name: Add-on image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build with pinned dependencies
        run: docker build --platform linux/${{ matrix.arch }} -t finance-v17-synthetic ./finance-v17
      - name: Verify architecture and run isolated fixtures
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' finance-v17-synthetic)" = "${{ matrix.arch }}"
          docker run --rm --network none --entrypoint python finance-v17-synthetic -m pip check
          docker run --rm --network none --entrypoint python \
            --mount type=bind,source="$PWD/tests",target=/tests,readonly \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTHONPATH=/opt/finance-v2/src:/tests \
            finance-v17-synthetic -m unittest test_snaptrade_036 test_snaptrade_037 test_open_finance_038 test_open_finance_039 test_open_finance_040 test_open_finance_041 test_open_finance_042
